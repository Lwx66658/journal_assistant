name = "journal-assistant"
main = "src/index.js"
compatibility_date = "2024-10-20"
compatibility_flags = ["nodejs_compat"]

# 账户信息 - 部署时需要填写你的 Cloudflare 账户 ID
# account_id = "your_account_id_here"

# Workers 路由配置
[env.production]
name = "journal-assistant-prod"
routes = [
  { pattern = "journal-assistant.your-domain.com/*", zone_name = "your-domain.com" }
]

# KV 存储配置（用于替代 localStorage，存储书刊和用户数据）
[[kv_namespaces]]
binding = "KV_STORE"
id = "your_kv_namespace_id_here"
preview_id = "your_preview_kv_namespace_id_here"

# D1 数据库配置（可选，未来如果需要关系型数据库）
# [[d1_databases]]
# binding = "DB"
# database_name = "journal_db"
# database_id = "your_database_id_here"

# 环境变量
[vars]
ENVIRONMENT = "production"
